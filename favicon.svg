<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 1. 3D Squircle Base Gradients -->
    <linearGradient id="baseLip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088FF" />
      <stop offset="50%" stop-color="#1E1B8B" />
      <stop offset="100%" stop-color="#4A0E9E" />
    </linearGradient>
    <linearGradient id="baseFace" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#071952" />
      <stop offset="55%" stop-color="#1D249B" />
      <stop offset="100%" stop-color="#3B138E" />
    </linearGradient>
    <linearGradient id="cyanRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#2979FF" />
      <stop offset="100%" stop-color="#9D4EDD" />
    </linearGradient>

    <!-- 2. Frosted Glass Clipboard Gradients -->
    <linearGradient id="boardGlass" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#C8E4FF" stop-opacity="0.72" />
      <stop offset="50%" stop-color="#7B96EC" stop-opacity="0.52" />
      <stop offset="100%" stop-color="#4C58C6" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="boardRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80F8FF" />
      <stop offset="50%" stop-color="#E0ECFF" />
      <stop offset="100%" stop-color="#9A8CFF" />
    </linearGradient>

    <!-- 3. Silver Metallic Clip -->
    <linearGradient id="silverClip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="55%" stop-color="#B8C7E8" />
      <stop offset="100%" stop-color="#6B7DB3" />
    </linearGradient>

    <!-- 4. 3D Extruded Gold Star -->
    <linearGradient id="goldExtrude" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <radialGradient id="goldStarFace" cx="42%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF099" />
      <stop offset="55%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#E67E00" />
    </radialGradient>

    <!-- 5. Cyan Financial Chart Bars -->
    <linearGradient id="chartBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38F9FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#03071E" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Outer 3D Squircle Lip -->
  <rect x="14" y="22" width="228" height="222" rx="54" fill="url(#baseLip)" />
  <!-- Main 3D Squircle Face -->
  <rect x="14" y="12" width="228" height="218" rx="54" fill="url(#baseFace)" stroke="url(#cyanRim)" stroke-width="5" />

  <!-- Clipboard 3D Shadow Lip -->
  <rect x="50" y="48" width="156" height="166" rx="24" fill="#0B1345" opacity="0.75" />
  <!-- Frosted Glass Clipboard Body -->
  <rect x="50" y="42" width="156" height="164" rx="24" fill="url(#boardGlass)" stroke="url(#boardRim)" stroke-width="3.5" />
  <!-- InnerClipboard Bevel Line -->
  <rect x="58" y="50" width="140" height="148" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Top Silver Clipboard Clip Base -->
  <path d="M90 36 H112 A16 16 0 0 1 144 36 H166 A8 8 0 0 1 174 44 V60 A6 6 0 0 1 168 66 H88 A6 6 0 0 1 82 60 V44 A8 8 0 0 1 90 36 Z" fill="url(#silverClip)" stroke="#FFFFFF" stroke-width="2" filter="url(#dropShadow)" />
  <!-- Clip Hole -->
  <circle cx="128" cy="36" r="6.5" fill="#101B5B" stroke="#94A3B8" stroke-width="1.5" />

  <!-- 3D Gold Star Extrusion (Bottom Depth Layer) -->
  <path d="M128 56 L142 84 L173 88.5 L150.5 110.5 L156 141.5 L128 127 L100 141.5 L105.5 110.5 L83 88.5 L114 84 Z" transform="translate(0, 7)" fill="url(#goldExtrude)" stroke="#78350F" stroke-width="5" stroke-linejoin="round" filter="url(#dropShadow)" />

  <!-- 3D Gold Star Top Face -->
  <path d="M128 56 L142 84 L173 88.5 L150.5 110.5 L156 141.5 L128 127 L100 141.5 L105.5 110.5 L83 88.5 L114 84 Z" fill="url(#goldStarFace)" stroke="#FFFBEB" stroke-width="3" stroke-linejoin="round" />

  <!-- Bottom-Left: 3 Checklist Rows -->
  <!-- Row 1 -->
  <rect x="66" y="140" width="16" height="16" rx="4" fill="#64748B" fill-opacity="0.45" stroke="#BAE6FD" stroke-width="1.8" />
  <path d="M70 148 L73 151 L78.5 145" fill="none" stroke="#E0F2FE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="88" y="145" width="32" height="5.5" rx="2.75" fill="#CBD5E1" />

  <!-- Row 2 -->
  <rect x="66" y="160" width="16" height="16" rx="4" fill="#64748B" fill-opacity="0.45" stroke="#BAE6FD" stroke-width="1.8" />
  <path d="M70 168 L73 171 L78.5 165" fill="none" stroke="#E0F2FE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="88" y="165" width="32" height="5.5" rx="2.75" fill="#CBD5E1" />

  <!-- Row 3 -->
  <rect x="66" y="180" width="16" height="16" rx="4" fill="#64748B" fill-opacity="0.45" stroke="#BAE6FD" stroke-width="1.8" />
  <path d="M70 188 L73 191 L78.5 185" fill="none" stroke="#E0F2FE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="88" y="185" width="32" height="5.5" rx="2.75" fill="#CBD5E1" />

  <!-- Bottom-Right:Dollar Coin Badge -->
  <circle cx="174" cy="144" r="13.5" fill="#0F296B" stroke="#7DD3FC" stroke-width="2.5" />
  <text x="174" y="150" text-anchor="middle" fill="#BAE6FD" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="17">$</text>

  <!-- Bottom-Right: 4 Ascending Chart Bars + Base Line -->
  <rect x="136" y="177" width="10" height="14" rx="2.5" fill="url(#chartBar)" />
  <rect x="150" y="169" width="10" height="22" rx="2.5" fill="url(#chartBar)" />
  <rect x="164" y="161" width="10" height="30" rx="2.5" fill="url(#chartBar)" />
  <rect x="178" y="166" width="10" height="25" rx="2.5" fill="url(#chartBar)" />
  <rect x="132" y="192" width="60" height="3.5" rx="1.75" fill="#BAE6FD" />
</svg>